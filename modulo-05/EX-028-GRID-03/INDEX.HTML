<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid-03 na pratica</title>
  <style>
    div.container {
      border: 3px solid blue;
      display: grid;
      grid-template-rows: repeat(3, 80px); 
      grid-template-columns: 1fr 4fr 1fr;
      grid-auto-flow: row;
      grid-auto-rows: 80px;
      grid-auto-columns: 120px;
      gap: 10px;
      place-items: normal normal;
      place-content: normal normal;
    }
 
     

    div.item {
      border: 3px solid red;
      padding: 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item item1">a</div>
    <div class="item item2">b</div>
    <div class="item item3">c</div>
    <div class="item item4">d</div>
    <div class="item item5">e</div>
    <div class="item item6">f</div>
    <div class="item item6">g</div>
    <div class="item item6">h</div>
    <div class="item item6">i</div>
    <div class="item item6">j</div>
    

  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>grid layout na pratica</title>
 <style>
   div.container 
   {
    border: 3px solid blue;
    height: 250px;
    display: grid;
    grid-template-columns: auto auto auto;
    grid templete-rows: auto auto auto;
    gap: 5px;
   }

   div.item
   {
    border: 3px solid red;
    padding: 5px;
   }
 </style>
</head>

<body>
  <div class="container">
    <div class="item item1">a</div>
    <div class="item item2">b</div>
    <div class="item item3">c</div>
    <div class="item item4">d</div>
    <div class="item item5">e</div>
    <div class="item item6">f</div>
    <div class="item item6">g</div>

  </div>
</body>
</html>
